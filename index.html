<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Communities & Birds Web Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .app { height: 100%; display: flex; }
  .panel { height: 100%; overflow: auto; border-right: 1px solid #e5e5e5; background: #fff; }
  #leftPanel { width: 280px; }
  #rightPanel { width: 420px; border-right: 0; border-left: 1px solid #e5e5e5; }
  #map { flex: 1; height: 100%; }
  .panelHeader { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e5; padding: 12px 12px 10px; z-index: 10; }
  .panelHeader h2 { margin: 0 0 8px; font-size: 16px; }
  .search { width: 100%; padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 10px; outline: none; }
  .list { padding: 8px; }
  .item { padding: 10px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
#leftPanel .item b { font-size: 13px; font-weight: 600; }
  .item:hover { background: #f6f6f6; }
  .item.active { background: #eef6ff; border-color: #cfe6ff; }
  .sub { font-size: 12px; color: #555; margin-top: 2px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid #e5e5e5; margin-left: 6px; color: #333; }
  .tag.rare { border-color: #f5c2c7; background: #fff0f1; }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tab { flex: 1; text-align: center; padding: 8px; border: 1px solid #d0d0d0; border-radius: 12px; cursor: pointer; user-select: none; }
  .tab.active { background: #111; color: #fff; border-color: #111; }
  .sectionTitle { font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
  .muted { color: #666; font-size: 12px; }
  .comm-label { background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.15); border-radius: 10px; padding: 2px 8px; font-size: 11px; }
  .popup h3 { margin: 0 0 6px; font-size: 16px; }
  .kv { margin: 0; }
  .kv dt { font-weight: 700; }
  .kv dd { margin: 0 0 6px; white-space: pre-wrap; }
  .hr { height: 1px; background: #eee; margin: 10px 0; }

  .infoCard { border: 1px solid #e9e9e9; border-radius: 18px; padding: 12px; background: linear-gradient(180deg, #ffffff 0%, #fafafa 100%); box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
  .infoTitle { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .infoTitle h3 { margin:0; font-size:14px; line-height:1.2; }
  .chipRow { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; padding:4px 10px; border-radius:999px; border:1px solid #e5e5e5; background:#fff; color:#222; }
  .chip strong { font-weight:700; }
  .infoGrid { margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .metric { border:1px solid #ededed; border-radius:14px; padding:8px 10px; background:#fff; }
  .metric .k { font-size:11px; color:#666; }
  .metric .v { font-size:13px; color:#111; font-weight:700; margin-top:2px; }
  .infoNotes { margin-top:10px; font-size:12px; color:#444; line-height:1.35; white-space:pre-wrap; }
        
  .popupCard{min-width:220px; max-width:260px; border:1px solid rgba(0,0,0,0.12); border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(245,248,255,0.98) 100%);
    box-shadow:0 10px 22px rgba(0,0,0,0.12); padding:10px 12px;}
  .popupTitle{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dot{width:10px; height:10px; border-radius:999px; background:rgba(59,130,246,0.9); box-shadow:0 0 0 4px rgba(59,130,246,0.15);}
  .popupTitle h3{margin:0; font-size:15px; line-height:1.2;}
  .miniTable{width:100%; border-collapse:separate; border-spacing:0 6px; font-size:12px;}
  .miniTable td{padding:6px 8px; background:rgba(255,255,255,0.85); border:1px solid rgba(0,0,0,0.08);}
  .miniTable td:first-child{border-radius:12px 0 0 12px; color:#444; font-weight:600; width:44%;}
  .miniTable td:last-child{border-radius:0 12px 12px 0; color:#111; font-weight:700;}
  .miniIcon{opacity:0.9; margin-right:6px;}
        
  .birdContextHeader{
    margin-top:12px;
    padding:14px 16px;
    border-radius:18px;
    background:linear-gradient(90deg, rgba(37,99,235,0.22), rgba(16,185,129,0.22));
    border:1px solid rgba(37,99,235,0.35);
    font-size:18px;
    font-weight:700;
    color:#0f172a;
    letter-spacing:0.3px;
  }
        </style>
</head>
<body>
<div class="app">
  <aside id="leftPanel" class="panel">
    <div class="panelHeader">
      <h2>Communities</h2>
      <input id="communitySearch" class="search" placeholder="Search communities…" />
      <div class="muted" style="margin-top:8px;">Click a community to zoom and update the bird list.</div>
    </div>
    <div id="communityList" class="list"></div>
    <div id="communityInfoBox" style="position:sticky; bottom:0; border-top:1px solid #e5e5e5; background:#fff; padding:12px;">
      <div class="muted" style="margin-bottom:6px;">Community info</div>
      <div id="communityInfoContent" class="muted">Select a community…</div>
    </div>
  </aside>

  <div id="map"></div>

  <aside id="rightPanel" class="panel">
    <div class="panelHeader">
      <h2>Birds</h2>
      <div class="tabs">
        <div id="tabSelected" class="tab active">Selected community</div>
        <div id="tabAll" class="tab">All communities</div>
      </div>
      <input id="birdSearch" class="search" style="margin-top:10px;" placeholder="Search birds…" />
      <div id="birdContext" class="muted" style="margin-top:8px;"></div>
    </div>
    <div id="birdList" class="list"></div>
  </aside>
</div>

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatCount(x) {
  if (x === null || x === undefined) return '';
  if (Number.isInteger(x)) return String(x);
  if (typeof x === 'number') return x.toFixed(2);
  return String(x);
}

function setActiveCommunity(commId) {
  activeCommunityId = commId;
  renderCommunityList();
  renderCommunityInfo();
  renderBirdPanel();
}

function renderCommunityInfo() {
  const box = document.getElementById('communityInfoContent');
  const c = DATA.communities.find(x => x.id === activeCommunityId) || null;
  if (!box) return;
  if (!c) { box.textContent = 'Select a community…'; return; }

  const pop = (c.population !== null && c.population !== undefined) ? c.population : '—';
  const borough = c.borough || '—';
  const ethnic = c.ethnic || '—';
  const dist = c.distance || '—';
  const area = c.area || '—';
  const species = (c.birdSpeciesCount !== null && c.birdSpeciesCount !== undefined) ? c.birdSpeciesCount : '—';
  const rare = (c.rareBirdCount !== null && c.rareBirdCount !== undefined) ? c.rareBirdCount : '—';

  box.innerHTML = `
    <div class="infoCard">
      <div class="infoTitle">
        <h3>${esc(c.name)}</h3>
        <span class="chip"><strong>${esc(pop)}</strong> people</span>
      </div>

      <div class="chipRow">
        <span class="chip"><strong>${esc(species)}</strong> species</span>
        <span class="chip"><strong>${esc(rare)}</strong> rare</span>
      </div>

      <div class="infoGrid">
        <div class="metric">
          <div class="k">Borough</div>
          <div class="v">${esc(borough)}</div>
        </div>
        <div class="metric">
          <div class="k">Race &amp; Ethnicity</div>
          <div class="v">${esc(ethnic)}</div>
        </div>
      </div>

      <div class="infoNotes"><b>Distance:</b> ${esc(dist)}</div>
      <div class="infoNotes"><b>Area:</b> ${esc(area)}</div>
    </div>
  `;
}

function popupHtml(c) {
  const pop = (c.population !== null && c.population !== undefined) ? c.population : '—';
  const ethnic = c.ethnic || '—';
  const species = (c.birdSpeciesCount !== null && c.birdSpeciesCount !== undefined) ? c.birdSpeciesCount : '—';
  const rare = (c.rareBirdCount !== null && c.rareBirdCount !== undefined) ? c.rareBirdCount : '—';

  return `
    <div class="popupCard">
      <div class="popupTitle">
        <span class="dot" aria-hidden="true"></span>
        <h3>${esc(c.name)}</h3>
      </div>

      <table class="miniTable" role="table" aria-label="Community summary">
        <tr>
          <td><span class="miniIcon">👥</span>Population</td>
          <td>${esc(pop)}</td>
        </tr>
        <tr>
          <td><span class="miniIcon">🧬</span>Ethnicity</td>
          <td>${esc(ethnic)}</td>
        </tr>
        <tr>
          <td><span class="miniIcon">🪶</span>Bird species</td>
          <td>${esc(species)}</td>
        </tr>
        <tr>
          <td><span class="miniIcon">⭐</span>Rare birds</td>
          <td>${esc(rare)}</td>
        </tr>
      </table>
</div>
  `;
}

// --- Markers ---
const markersById = new Map();

DATA.communities.forEach(c => {
  const marker = L.circleMarker([c.lat, c.lon], {
    radius: 7,
    weight: 2,
    opacity: 1,
    fillOpacity: 0.7
  });

  marker.bindPopup(popupHtml(c));
  marker.bindTooltip(c.name, { permanent: true, direction: 'right', className: 'comm-label', offset: [10, 0] });

  marker.on('click', () => {
    setActiveCommunity(c.id);
  });

  marker.addTo(map);
  markersById.set(c.id, marker);
});

// --- Left panel: communities ---
const communityListEl = document.getElementById('communityList');
const communitySearchEl = document.getElementById('communitySearch');

communitySearchEl.addEventListener('input', (e) => {
  communitySearchText = e.target.value.toLowerCase().trim();
  renderCommunityList();
});

function renderCommunityList() {
  const filtered = DATA.communities
    .filter(c => {
      if (!communitySearchText) return true;
      return (c.name || '').toLowerCase().includes(communitySearchText) ||
             (c.baseName || '').toLowerCase().includes(communitySearchText) ||
             (c.borough || '').toLowerCase().includes(communitySearchText);
    })
    .sort((a,b) => (a.baseName).localeCompare(b.baseName));

  communityListEl.innerHTML = '';

  filtered.forEach(c => {
    const div = document.createElement('div');
    div.className = 'item' + (c.id === activeCommunityId ? ' active' : '');
    div.innerHTML = `
      <div><b>${esc(c.name)}</b></div>
      <div class="sub">${esc(c.borough || '')}</div>
      <div class="sub">Bird species: ${c.birdSpeciesCount}</div>`;
    div.addEventListener('click', () => {
      const m = markersById.get(c.id);
      if (m) {
        map.setView(m.getLatLng(), 9, { animate: true });
        m.openPopup();
      }
      setActiveCommunity(c.id);
    });
    communityListEl.appendChild(div);
  });
}

// --- Right panel: birds ---
const birdListEl = document.getElementById('birdList');
const birdSearchEl = document.getElementById('birdSearch');
const tabSelectedEl = document.getElementById('tabSelected');
const tabAllEl = document.getElementById('tabAll');
const birdContextEl = document.getElementById('birdContext');

birdSearchEl.addEventListener('input', (e) => {
  birdSearchText = e.target.value.toLowerCase().trim();
  renderBirdPanel();
});

tabSelectedEl.addEventListener('click', () => {
  birdMode = 'selected';
  tabSelectedEl.classList.add('active');
  tabAllEl.classList.remove('active');
  renderBirdPanel();
});

tabAllEl.addEventListener('click', () => {
  birdMode = 'all';
  tabAllEl.classList.add('active');
  tabSelectedEl.classList.remove('active');
  renderBirdPanel();
});

function renderBirdPanel() {
  birdListEl.innerHTML = '';

  if (birdMode === 'selected') {
    const c = DATA.communities.find(x => x.id === activeCommunityId) || null;
    if (!c) {
      birdContextEl.textContent = 'Select a community to see its birds.';
      return;
    }
    birdContextEl.textContent = `${c.baseName} — ${c.birdSpeciesCount} species (${
      c.rareBirdCount
    } rare)`;

    const birdsAll = (c.birds || []).filter(b => {
      if (!birdSearchText) return true;
      return (b.common || '').toLowerCase().includes(birdSearchText) ||
             (b.scientific || '').toLowerCase().includes(birdSearchText);
    });

    const mainBirds = birdsAll.filter(b => (b.scientific || '').trim().length > 0);
    const additionalBirds = birdsAll.filter(b => (b.scientific || '').trim().length === 0);

    // Main birds (with scientific name) — numbered + linked
    mainBirds.forEach((b, idx) => {
      const div = document.createElement('div');
      div.className = 'item';
      const birdSlug = (b.common || '').trim().replace(/\s+/g,'_');
      const birdUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(birdSlug)}`;
      div.innerHTML = `
        <div>
          <b style="color:#1d4ed8;">${idx+1}. <a href="${birdUrl}" target="_blank" rel="noopener noreferrer">${esc(b.common || 'Unknown')}</a></b>
          ${b.isRare ? '<span class="tag rare">Rare</span>' : ''}
        </div>
        <div class="sub"><i>${esc(b.scientific || '')}</i>${b.count !== null && b.count !== undefined ? ` • Count: ${esc(formatCount(b.count))}` : ''}</div>
      `;
      birdListEl.appendChild(div);
    });

    // Additional birds (no scientific name) — no links
    if (additionalBirds.length) {
      const header = document.createElement('div');
      header.className = 'item';
      header.style.cursor = 'default';
      header.style.background = 'transparent';
      header.style.border = '0';
      header.style.padding = '10px 4px 6px';
      header.innerHTML = `<div class="muted"><b>Additional birds</b> (no scientific name)</div>`;
      birdListEl.appendChild(header);

      additionalBirds.forEach((b, j) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div>
            <b>${j+1}. ${esc(b.common || 'Unknown')}</b>
            ${b.isRare ? '<span class="tag rare">Rare</span>' : ''}
          </div>
        `;
        birdListEl.appendChild(div);
      });
    }

  } else {
    birdContextEl.textContent = `${DATA.allBirds.length} unique birds across all communities.`;
    const birds = DATA.allBirds.filter(b => {
      if (!birdSearchText) return true;
      return (b.common || '').toLowerCase().includes(birdSearchText) ||
             (b.scientific || '').toLowerCase().includes(birdSearchText);
    });

    birds.forEach((b, idx) => {
      const div = document.createElement('div');
      div.className = 'item';
      const comms = (b.communities || []).join(', ');
      const birdSlug = (b.common || '').trim().replace(/\s+/g,'_');
      const birdUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(birdSlug)}`;
      div.innerHTML = `
        <div>
          <b style="color:#1d4ed8;">${idx+1}. <a href="${birdUrl}" target="_blank" rel="noopener noreferrer">${esc(b.common || 'Unknown')}</a></b>
          ${b.isRare ? '<span class="tag rare">Rare</span>' : ''}
        </div>
        <div class="sub"><i>${esc(b.scientific || '')}</i></div>
        <div class="sub">Communities: ${esc(comms)}${b.totalCount !== null && b.totalCount !== undefined ? ` • Total count: ${esc(formatCount(b.totalCount))}` : ''}</div>
      `;
      birdListEl.appendChild(div);
    });
  }
}

// Initial render
renderCommunityList();
// default select first community
if (DATA.communities.length) {
  setActiveCommunity(DATA.communities[0].id);
  const m = markersById.get(DATA.communities[0].id);
  if (m) m.openPopup();
}
</script>
</body>
</html>
